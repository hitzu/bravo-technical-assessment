apiVersion: apps/v1
kind: Deployment
metadata:
  name: bravo-frontend
  namespace: bravo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bravo-frontend
  template:
    metadata:
      labels:
        app: bravo-frontend
    spec:
      containers:
        - name: frontend
          # Placeholder image name for the technical assessment.
          # Replace with your real registry image (built by CI) when deploying.
          image: ghcr.io/hitzu/bravo-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: configmap-frontend
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
