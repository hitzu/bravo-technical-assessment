apiVersion: v1
kind: Secret
metadata:
  name: secret-backend
  namespace: bravo
type: Opaque
stringData:
  # Placeholder only. In real deployments, prefer:
  # - `kubectl create secret ...`, or
  # - an external secret manager (ExternalSecrets, Vault, etc.)
  #
  # DB config supports either DB_URL or split variables.
  DB_URL: 'postgres://user:password@host:5432/bravo_prod'
  # DB_HOST: "host"
  # DB_PORT: "5432"
  # DB_NAME: "bravo_prod"
  # DB_USERNAME: "user"
  # DB_PASSWORD: "password"

  # Auth secrets (placeholders)
  JWT_SECRET: 'CHANGE_ME'
  JWT_EXPIRATION: '7d'
  JWT_REFRESH_SECRET: 'CHANGE_ME_TOO'
  JWT_REFRESH_EXPIRATION: '30d'
  ASYNC_JOBS_CRON_ENABLED: 'false'
  ASYNC_JOBS_CRON_LIMIT: '10'
